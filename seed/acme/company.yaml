# scope: personal | department | enterprise | restricted       (ARCHITECTURE §7.2)
# trust: official | reference | discussion;  sensitivity: internal | confidential | restricted
# viewers/editors: department:<key> (members), department-manager:<key>, group:<key>, user:<email>.
# Department collections default to department managers as editors.
# Governance (docs/governance.md): `owner` approves official status and owns the seeded
# documents; they are due for review `review_interval_days` after `last_reviewed`. The dates are
# fixed so that, in November 2026, the handbook and HR guidance are overdue and engineering,
# finance and operations are due within 30 days. Owners are people who already edit the
# collection, so owning one gives nobody new access.
collections:
  - key: company-handbook
    name: Company Handbook
    scope: enterprise
    trust: official
    editors: [department-manager:hr]
    owner: alice@acme.test
    review_interval_days: 365
    last_reviewed: 2025-11-03
    description: Company-wide policies (leave, travel, expenses, code of conduct, security).
  - key: hr-guidance
    name: HR Guidance (internal)
    scope: department
    department: hr
    trust: reference
    owner: alice@acme.test
    review_interval_days: 180
    last_reviewed: 2026-04-20
    description: HR-internal procedures, policy drafts, including an outdated 2025 leave policy.
  - key: hr-employee-records
    name: Employee Records
    scope: restricted
    viewers: [group:hr-records]
    sensitivity: restricted
    editors: [group:hr-records]
    description: Salary bands, performance reviews, personal data. Contains canary tokens.
  - key: engineering-docs
    name: Engineering Docs
    scope: department
    department: engineering
    trust: reference
    owner: marcus.bell@acme.test
    review_interval_days: 180
    last_reviewed: 2026-06-01
    description: ADRs, API documentation, runbooks, incident postmortems.
  - key: finance-reports
    name: Finance Reports
    scope: department
    department: finance
    viewers: [group:leadership]
    sensitivity: confidential
    owner: hannah.schmidt@acme.test
    review_interval_days: 90
    last_reviewed: 2026-09-01
    description: Monthly P&L, budgets, revenue by product line (XLSX + PDF).
  - key: finance-payroll
    name: Payroll
    scope: restricted
    viewers: [group:finance-leads, group:hr-records]
    sensitivity: restricted
    editors: [group:finance-leads]
    description: Payroll runs and leave-benefit payouts. Contains canary tokens.
  - key: sales-accounts
    name: Sales Accounts
    scope: department
    department: sales
    description: Proposals, account plans, win/loss notes.
  - key: marketing-campaigns
    name: Marketing Campaigns
    scope: department
    department: marketing
    description: Campaign briefs and performance reports.
  - key: support-knowledge
    name: Support Knowledge Base
    scope: department
    department: support
    viewers: [department:engineering]
    owner: samuel.mensah@acme.test
    review_interval_days: 180
    last_reviewed: 2026-08-03
    description: Ticket resolutions, known issues, escalation guides.
  - key: operations-sops
    name: Operations SOPs
    scope: enterprise
    trust: official
    editors: [department-manager:operations]
    owner: olivia.grant@acme.test
    review_interval_days: 365
    last_reviewed: 2025-12-01
    description: Standard operating procedures for warehouses, shipping and on-call.
  - key: legal-contracts
    name: Legal & Contracts
    scope: enterprise
    trust: official
    editors: [department-manager:management]
    owner: priya.raman@acme.test
    description: >-
      Contract signature authority, NDAs, supplier and customer contract terms, data processing
      agreements (GDPR), export control, records retention and legal holds, IP assignment,
      anti-bribery and gifts.
  - key: leadership-strategy
    name: Leadership Strategy
    scope: restricted
    viewers: [group:leadership]
    sensitivity: restricted
    editors: [group:leadership]
    description: Board updates, strategy, a confidential acquisition plan. Contains canary tokens.
  - key: slack-general
    name: "Slack: #general"
    scope: enterprise
    trust: discussion
    editors: [user:erin@acme.test]
    description: Exported chat threads. Some messages contradict official policy on purpose.
  - key: contractor-onboarding
    name: Contractor Onboarding
    scope: restricted
    viewers: [user:mallory@acme.test, department:engineering]
    editors: [department-manager:engineering]
    description: The only collection the external contractor can see.

# Department agents (ARCHITECTURE 12.2): configuration, not code. An agent only narrows what the
# asking person may see; it never adds access. Descriptions are written for the planner.
# The Legal agent is deliberately not here: an administrator creates it in Admin > Agents
# (docs/agents.md walks through it), and the routing eval skips its questions until then.
agents:
  - key: hr
    name: HR agent
    description: >-
      People and HR policy: leave (annual, parental, sick), holidays, remote work, onboarding,
      probation, performance reviews, the code of conduct, and, for people allowed to see them,
      salary bands and individual employee records.
    collections: [company-handbook, hr-guidance, hr-employee-records, slack-general]
    examples:
      - How many weeks of parental leave do we get?
      - When do performance reviews happen?
      - Can I work from another country?
  - key: engineering
    name: Engineering agent
    description: >-
      FleetOS and robot software: architecture decisions, the Fleet API, incidents and
      postmortems, the on-call runbook, the engineering roadmap and releases.
    collections: [engineering-docs]
    examples:
      - How do I restart the fleet controller?
      - What caused incident INC-2026-031?
      - When is FleetOS 3.0 released?
  - key: finance
    name: Finance agent
    description: >-
      Money: revenue, margins, operating costs, budgets, payroll totals, and the travel and
      expenses policy (limits, receipts, reimbursement).
    collections: [finance-reports, finance-payroll, company-handbook]
    examples:
      - What was revenue in Q3 2026?
      - What is the hotel limit in London?
      - What is the 2027 engineering budget?
  - key: sales
    name: Sales agent
    description: >-
      Customers and deals: account plans, renewals, proposals, win/loss notes.
    collections: [sales-accounts]
    examples:
      - When does the Bluefin Freight contract renew?
      - Why did we lose the Harbor Logistics deal?
  - key: support
    name: Support agent
    description: >-
      Customer support: SLAs and response times, known product issues and fixes, support
      tickets.
    collections: [support-knowledge]
    examples:
      - What is the first response time for P1 incidents?
      - Which firmware fixes AMR-200 battery degradation?
  - key: operations
    name: Operations agent
    description: >-
      Warehouses and logistics: safety procedures, shipping, lead times and returns.
    collections: [operations-sops]
    examples:
      - How big is the exclusion zone around AMR-500 robots?
      - How long do customers have to request a return?
  - key: marketing
    name: Marketing agent
    description: >-
      Marketing: campaigns, launch plans, lead targets and campaign performance.
    collections: [marketing-campaigns]
    examples:
      - When does the FleetOS 3.0 launch campaign start?
  - key: leadership
    name: Leadership agent
    description: >-
      Company strategy for leadership: board updates, acquisitions and other confidential
      plans. Only useful for people with leadership access.
    collections: [leadership-strategy]
    examples:
      - What did we tell the board in Q3?
