# Acme Robotics: the fictional company used for WorkMind demos and evaluation.
# Everything in this file is invented. Any resemblance to real people or companies is
# coincidental. `.test` is a reserved top-level domain (RFC 2606) and never resolves.
#
# Phase 1 seeds Keycloak users, departments, groups and collections from this file.
# Phase 2 adds facts.yaml (ground truth) and generates the document corpus from it.

company:
  name: Acme Robotics
  slug: acme
  domain: acme.test
  industry: Warehouse robotics (autonomous mobile robots and fleet software)
  headcount: 180
  founded: 2019
  timezone: UTC
  policy:
    # The demo data is fictional, so restricted documents may go to the hosted model.
    # Real tenants default to local_only: restricted sources never reach an external API
    # (they go to LOCAL_LLM_* if configured, otherwise they are left out). ARCHITECTURE 11.6.
    restricted_data: allow

departments:
  - { key: management,  name: Management }
  - { key: hr,          name: People & HR }
  - { key: engineering, name: Engineering }
  - { key: finance,     name: Finance }
  - { key: sales,       name: Sales }
  - { key: marketing,   name: Marketing }
  - { key: support,     name: Customer Support }
  - { key: operations,  name: Operations }

# Cross-department groups that unlock restricted collections.
groups:
  - { key: leadership,    description: Executive team }
  - { key: hr-records,    description: HR staff allowed to see employee records }
  - { key: finance-leads, description: Finance managers with access to payroll and budgets }

