# Acme Robotics' semantic model for the business-intelligence agent (ARCHITECTURE section 16).
# The tables are the CSVs in data/ (generated by generate.py); `python -m needwise.seed` loads
# both into the tenant. Everything here is fictional.
#
# The agent may only query these tables. Metrics and dimensions are the vocabulary it should
# prefer; row policies decide which rows each person sees, and are enforced in code by the SQL
# guard, whatever SQL the model writes.

name: Acme Robotics finance and sales
description: >
  Invoicing (revenue by month, product line and customer) and the sales pipeline (deals by
  stage, owner and expected close date) for Acme Robotics, January to September 2026.
  Amounts are in euros. Revenue is invoiced revenue: void invoice lines are not revenue.
data_through: 2026-09-30  # the last closed month; October is not closed yet

# Shown to people who may query, as questions to start from.
examples:
  - Monthly revenue trend this year and the top 3 drivers
  - Revenue by product line per quarter
  - Which customers grew the most from Q1 to Q3?
  - What is the open pipeline by stage?
  - What was the win rate in Q3, and why were deals lost?

# Who may query this model at all.
access:
  - department:finance
  - department:sales
  - group:leadership

tables:
  customers:
    description: One row per customer or prospect.
    columns:
      customer_id: { type: text, description: "Customer id, e.g. C001." }
      name: { type: text, description: Customer name. }
      segment: { type: text, description: "Industry segment: 3PL, Parcel, Manufacturing, Retail, Grocery, Healthcare." }
      region: { type: text, description: "Sales region: DACH, Benelux, Nordics, France, Iberia, UK & Ireland." }
      country: { type: text, description: "ISO 3166 country code, e.g. DE." }
      account_owner: { type: text, description: E-mail of the account executive who owns the customer. }
      customer_since: { type: date, description: "First month invoiced (empty for prospects)." }
      status: { type: text, description: "customer, or prospect (never invoiced)." }
  products:
    description: The price list. Robots are sold once; FleetOS is billed monthly per robot.
    columns:
      product_id: { type: text, description: "Product id: AMR-200, AMR-500, FLEETOS-STD, FLEETOS-PLUS." }
      name: { type: text, description: Product name. }
      product_line: { type: text, description: "Product line: AMR-200, AMR-500 or FleetOS." }
      list_price_eur: { type: integer, format: eur, description: "List price in euros (FleetOS: per robot per month)." }
      billing: { type: text, description: "one-off (robots) or monthly (FleetOS subscriptions)." }
  invoice_lines:
    description: >
      One row per invoice line. Revenue counts lines whose status is not 'void'
      (void lines were cancelled and re-issued).
    time_column: invoice_date
    columns:
      invoice_line_id: { type: text, description: "Invoice line id, e.g. INV-00001." }
      invoice_date: { type: date, description: Date the invoice was issued. }
      customer_id: { type: text, description: The customer billed. }
      product_id: { type: text, description: The product billed. }
      quantity: { type: integer, description: "Robots delivered, or robot-months for FleetOS." }
      amount_eur: { type: integer, format: eur, description: Line amount in euros. }
      status: { type: text, description: "paid, open (not yet paid) or void (cancelled: not revenue)." }
  opportunities:
    description: >
      The sales pipeline: one row per deal. close_date is the actual close date for won and
      lost deals and the expected close date for open ones.
    time_column: close_date
    columns:
      opportunity_id: { type: text, description: "Deal id, e.g. OPP-001." }
      customer_id: { type: text, description: The customer or prospect. }
      name: { type: text, description: Deal name. }
      product_line: { type: text, description: "Product line sold: AMR-200, AMR-500 or FleetOS." }
      amount_eur: { type: integer, format: eur, description: Deal value in euros. }
      stage: { type: text, description: "qualified, proposal, negotiation (open), won or lost." }
      owner: { type: text, description: E-mail of the deal owner. }
      created_date: { type: date, description: Date the deal was created. }
      close_date: { type: date, description: "Close date (expected, for open deals)." }
      loss_reason: { type: text, description: "Why a lost deal was lost: price, timing, feature gap, competitor." }

# Many-to-one, from the fact tables (invoice_lines, opportunities) to their dimensions.
joins:
  - { left: invoice_lines.customer_id, right: customers.customer_id }
  - { left: invoice_lines.product_id, right: products.product_id }
  - { left: opportunities.customer_id, right: customers.customer_id }

dimensions:
  product_line: { sql: products.product_line, description: "Product line of an invoice line: AMR-200, AMR-500, FleetOS." }
  product: { sql: products.name, description: Product of an invoice line. }
  customer: { sql: customers.name, description: Customer name. }
  segment: { sql: customers.segment, description: Customer segment. }
  region: { sql: customers.region, description: Customer sales region. }
  country: { sql: customers.country, description: Customer country code. }
  account_owner: { sql: customers.account_owner, description: Account executive who owns the customer. }
  customer_status: { sql: customers.status, description: "customer or prospect." }
  invoice_status: { sql: invoice_lines.status, description: "paid, open or void." }
  stage: { sql: opportunities.stage, description: "Deal stage: qualified, proposal, negotiation, won, lost." }
  deal: { sql: opportunities.name, description: Deal name. }
  deal_owner: { sql: opportunities.owner, description: Owner of the deal. }
  deal_product_line: { sql: opportunities.product_line, description: Product line of a deal. }
  loss_reason: { sql: opportunities.loss_reason, description: Why a lost deal was lost. }

metrics:
  revenue:
    table: invoice_lines
    sql: sum(amount_eur)
    filter: status <> 'void'
    format: eur
    description: Invoiced revenue in euros (invoice lines that are not void).
  invoiced_units:
    table: invoice_lines
    sql: sum(quantity)
    filter: status <> 'void'
    description: Units on invoice lines that are not void (robots for AMR lines, robot-months for FleetOS).
  open_receivables:
    table: invoice_lines
    sql: sum(amount_eur)
    filter: status = 'open'
    format: eur
    description: Invoiced but not yet paid, in euros.
  customers_billed:
    table: invoice_lines
    sql: count(DISTINCT customer_id)
    filter: status <> 'void'
    description: Number of distinct customers with revenue.
  pipeline_value:
    table: opportunities
    sql: sum(amount_eur)
    filter: stage IN ('qualified', 'proposal', 'negotiation')
    format: eur
    description: Value of open deals (qualified, proposal, negotiation), in euros.
  won_value:
    table: opportunities
    sql: sum(amount_eur)
    filter: stage = 'won'
    format: eur
    description: Value of won deals, in euros.
  deals:
    table: opportunities
    sql: count(*)
    description: Number of deals (any stage; filter by stage to narrow).
  win_rate:
    table: opportunities
    sql: >-
      100.0 * count(*) FILTER (WHERE stage = 'won')
      / nullif(count(*) FILTER (WHERE stage IN ('won', 'lost')), 0)
    format: percent
    description: Won deals as a percentage of closed (won + lost) deals.
  average_deal_size:
    table: opportunities
    sql: avg(amount_eur)
    filter: stage = 'won'
    format: eur
    description: Average value of won deals, in euros.

row_policies:
  - name: Own accounts only
    description: >
      Account executives see only the customers they own, those customers' invoice lines,
      and the deals they own.
    applies_to: [department:sales]
    unless: [department-manager:sales, group:leadership, department:finance]
    filters:
      customers: account_owner = {user.email}
      invoice_lines: customer_id IN (SELECT customer_id FROM customers WHERE account_owner = {user.email})
      opportunities: owner = {user.email}
