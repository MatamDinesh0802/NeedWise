# WorkMind AI local stack.
#   make up        -> build and start everything, wait until healthy
#   make infra     -> infrastructure only (run api/web on the host)
# Every default below is for LOCAL DEVELOPMENT ONLY. Override them in .env (see .env.example).
# Host ports bind to 127.0.0.1, so nothing is reachable from your network.

name: workmind

# Shared by the API, the ingestion worker and the seed tool. Settings you put in .env (LLM models,
# ANTHROPIC_API_KEY, ...) reach these containers through env_file; container hostnames win.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://workmind_app:${WORKMIND_APP_PASSWORD:-workmind_app}@postgres:5432/workmind
  VALKEY_URL: redis://valkey:6379/0
  CELERY_BROKER_URL: redis://valkey:6379/1
  QDRANT_URL: http://qdrant:6333
  OPENFGA_API_URL: http://openfga:8080
  OPENFGA_API_KEY: ${OPENFGA_API_KEY:-dev-only-openfga-key}
  KEYCLOAK_URL: http://keycloak:8080/auth
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8480}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-only-oidc-client-secret}
  OBJECT_STORAGE_PATH: /data/objects
  # The embedding server runs on the host by default (make embeddings: Apple GPU via Metal).
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8091/v1}
  # single (default) | auto | agents: see ADR 0009. Try: ASSISTANT_MODE=auto make up
  ASSISTANT_MODE: ${ASSISTANT_MODE:-single}
  # Development mail: everything lands in Mailpit (http://localhost:8025), nothing is delivered.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-WorkMind <workmind@acme.test>}

x-app-env-file: &app-env-file
  - path: .env
    required: false

# One image for the API, workers, beat, migrations and seeding. It includes the Enterprise
# package from ee/ (named build context "ee"), which stays inactive without a license.
x-api-build: &api-build
  context: apps/api
  additional_contexts:
    ee: ./ee

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      WORKMIND_OWNER_PASSWORD: ${WORKMIND_OWNER_PASSWORD:-workmind_owner}
      WORKMIND_APP_PASSWORD: ${WORKMIND_APP_PASSWORD:-workmind_app}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD:-openfga}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      # -h 127.0.0.1 forces TCP, which only opens after the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes: [valkey_data:/data]
    ports: ["127.0.0.1:${VALKEY_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]
    healthcheck:
      test:
        # /dev/tcp is a bash feature; the image's /bin/sh is dash, so call bash explicitly.
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r -t 3 status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  openfga-migrate:
    image: openfga/openfga:v1.22.1
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD:-openfga}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  openfga:
    image: openfga/openfga:v1.22.1
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD:-openfga}@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
      # Every API call needs this key; only the WorkMind API knows it.
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_API_KEY:-dev-only-openfga-key}
    depends_on:
      openfga-migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${OPENFGA_PORT:-8401}:8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # Imports deploy/keycloak/realm-workmind.json once, when the realm doesn't exist yet.
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Served behind Caddy at <PUBLIC_URL>/auth. Containers reach it at http://keycloak:8080/auth.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:8480}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      # Placeholders used by the realm import file.
      WORKMIND_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-only-oidc-client-secret}
      WORKMIND_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8480}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        # /dev/tcp is a bash feature; the image's /bin/sh is dash, so call bash explicitly.
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r -t 3 status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    build: *api-build
    image: workmind-api:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://workmind_owner:${WORKMIND_OWNER_PASSWORD:-workmind_owner}@postgres:5432/workmind
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: *api-build
    image: workmind-api:dev
    env_file: *app-env-file
    environment:
      <<: *app-env
      # Trust X-Forwarded-* headers: only Caddy (and localhost) can reach this container.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./.data/objects:/data/objects
      # License files from `make ee-dev-license` (docs/enterprise.md). Empty: Community.
      - ./.workmind:/run/workmind:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      openfga: { condition: service_healthy }
      keycloak: { condition: service_started }
    ports: ["127.0.0.1:${API_PORT:-8400}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=8)"]
      # Generous: on a busy laptop, starting an interpreter alone can take seconds.
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Ingestion and other background jobs (Celery). Scale with: docker compose up --scale worker=3
  worker:
    build: *api-build
    image: workmind-api:dev
    command: ["celery", "-A", "workmind.workers.celery_app", "worker", "-Q", "ingest,default", "--concurrency", "2", "--loglevel", "INFO"]
    env_file: *app-env-file
    environment:
      <<: *app-env
    volumes:
      - ./.data/objects:/data/objects
      - whisper-models:/models  # the speech-to-text model, downloaded on the first recording
      - ./.workmind:/run/workmind:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    restart: unless-stopped

  # The embedding model in a container (CPU), for any OS:  make quickstart  or
  # COMPOSE_PROFILES=embeddings with EMBEDDING_BASE_URL=http://embeddings:8080/v1.
  # On a Mac, `make embeddings` runs the same model on the host GPU instead (faster).
  embeddings:
    profiles: [embeddings]
    image: ghcr.io/ggml-org/llama.cpp:server-b12098
    command:
      - "-hf"
      - "ggml-org/embeddinggemma-300M-GGUF:Q8_0"
      - "--embeddings"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "8192"
      - "--parallel"
      - "4"
      - "-ub"
      - "2048"
      - "-b"
      - "2048"
    volumes:
      - llama-models:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 120  # the first start downloads the model (~330 MB)
    restart: unless-stopped

  # Catches all outgoing mail in development: http://localhost:8025 (never delivers anything).
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    restart: unless-stopped

  # Starts scheduled work: every minute it queues the connector syncs that are due. Run exactly
  # one of these, however many workers you scale to.
  beat:
    build: *api-build
    image: workmind-api:dev
    command: ["celery", "-A", "workmind.workers.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: *app-env-file
    environment:
      <<: *app-env
    volumes:
      - ./.workmind:/run/workmind:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    restart: unless-stopped

  # Development tool, not part of `up`:  make seed  (= docker compose --profile tools run --rm seed)
  seed:
    profiles: [tools]
    build: *api-build
    image: workmind-api:dev
    command: ["python", "-m", "workmind.seed", "/seed/acme/company.yaml"]
    volumes:
      - ./seed:/seed:ro
      - ./.data/objects:/data/objects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: *app-env-file
    environment:
      <<: *app-env
      # Seeding creates tenants, which only the owner role may do.
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://workmind_owner:${WORKMIND_OWNER_PASSWORD:-workmind_owner}@postgres:5432/workmind
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-workmind-demo}
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  web:
    build: { context: apps/web }
    image: workmind-web:dev
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_DEMO: ${NEXT_PUBLIC_DEMO:-1}   # "View as" demo switcher; read at runtime via /runtime-config
    depends_on:
      api: { condition: service_started }
    ports: ["127.0.0.1:${WEB_PORT:-3400}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      # Generous: on a busy laptop, starting an interpreter alone can take seconds.
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop provides it already
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports: ["127.0.0.1:${HTTP_PORT:-8480}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9180/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  llama-models:
  whisper-models:
  postgres_data:
  valkey_data:
  qdrant_data:
  caddy_data:
