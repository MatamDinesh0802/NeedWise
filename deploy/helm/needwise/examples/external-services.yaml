# Every dependency runs outside the chart: a managed Postgres, Valkey, Qdrant, OpenFGA and
# Keycloak you operate, and an embedding API. Only NeedWise's own workloads are installed.
#   helm install needwise deploy/helm/needwise -n needwise -f deploy/helm/needwise/examples/external-services.yaml
# Before installing, prepare the services as docs/deploy/kubernetes.md ("External services")
# describes: the two database roles and the database, the realm in Keycloak, the OpenFGA key.

config:
  publicUrl: https://needwise.example.com
  embedding:
    # Any OpenAI-compatible /v1/embeddings server. Changing the model later means re-indexing.
    baseUrl: http://embeddings.ml.svc.cluster.local:8080/v1
    model: embeddinggemma-300m
    dimensions: 768

database:
  host: postgres.example.internal
  port: 5432
  name: needwise
  appUser: needwise_app
  ownerUser: needwise_owner
  urlParams: ssl=require

postgresql:
  enabled: false

valkey:
  enabled: false
  auth:
    enabled: true
  external:
    host: valkey.example.internal
    port: 6380
    tls: true

qdrant:
  enabled: false
  external:
    url: http://qdrant.vector.svc.cluster.local:6333

openfga:
  enabled: false
  external:
    url: http://openfga.authz.svc.cluster.local:8080

keycloak:
  enabled: false
  external:
    # The base URL with Keycloak's relative path, if it has one. The realm "needwise" must exist
    # there with the confidential client "needwise-api" (files/keycloak/realm-needwise.json).
    url: https://sso.example.com
  realm: needwise
  oidcClientId: needwise-api

embeddings:
  enabled: false

# One Secret you manage holds every credential, under these keys:
#   database-app-password, database-owner-password, valkey-password, openfga-api-key,
#   oidc-client-secret, secrets-key, secrets-encryption-key, anthropic-api-key
# and, when used: secrets-encryption-previous-keys, smtp-password, google-client-secret,
#   slack-client-secret, atlassian-client-secret, microsoft-client-secret, license-key,
#   mcp-servers, llm-api-key, local-llm-api-key, embedding-api-key, transcription-api-key
# Not "needwise-credentials": that is the name of the Secret the chart creates itself.
credentials:
  existingSecret: needwise-secrets

ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
    secretName: needwise-tls
