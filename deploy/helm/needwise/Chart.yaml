apiVersion: v2
name: needwise
description: >-
  NeedWise, a permission-aware enterprise AI workspace: the API, background workers, the
  scheduler and the web app, with optional bundled Postgres, Valkey, Qdrant, OpenFGA, Keycloak
  and an embedding server.
type: application
# The chart's own version (SemVer). Bump it on every change to the chart.
version: 0.2.0
# The NeedWise version the chart deploys by default (the image tag when none is set). release-please
# updates it with the other version files (the marker below); bump `version` by hand.
appVersion: "1.0.1" # x-release-please-version
# Validated against the Kubernetes 1.33 schemas (kubeconform); gRPC probes need 1.27 or later.
kubeVersion: ">=1.29.0-0"
keywords:
  - ai
  - rag
  - knowledge-base
  - permissions
annotations:
  licenses: Apache-2.0
