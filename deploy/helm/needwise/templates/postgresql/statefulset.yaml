{{- if .Values.postgresql.enabled }}
{{- $c := .Values.postgresql -}}
{{- $name := include "needwise.componentName" (list . "postgresql") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "needwise.labels" (list . "postgresql") | nindent 4 }}
data:
  # A copy of deploy/postgres/init/01-databases.sh (CI checks that they match). It runs once,
  # when the data volume is empty.
  01-databases.sh: |
    {{- .Files.Get "files/postgres/01-databases.sh" | nindent 4 }}
---
{{ include "needwise.service" (list . "postgresql" (dict "ports" (list (dict "name" "postgresql" "port" 5432)))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "needwise.labels" (list . "postgresql") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "needwise.selectorLabels" (list . "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "needwise.labels" (list . "postgresql") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "needwise.selectorLabels" (list . "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "needwise.selectorLabels" (list . "postgresql") | nindent 8 }}
      annotations:
        checksum/init: {{ .Files.Get "files/postgres/01-databases.sh" | sha256sum }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "needwise.podCommon" (list . $c) | nindent 6 }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: {{ include "needwise.image" (list . $c.image "") }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          {{- with $c.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: postgres
            {{- include "needwise.credentialEnv" (list . "postgresPassword" "POSTGRES_PASSWORD") | nindent 12 }}
            # Read by the init script (roles and databases for NeedWise, Keycloak and OpenFGA).
            {{- include "needwise.credentialEnv" (list . "databaseOwnerPassword" "NEEDWISE_OWNER_PASSWORD") | nindent 12 }}
            {{- include "needwise.credentialEnv" (list . "databaseAppPassword" "NEEDWISE_APP_PASSWORD") | nindent 12 }}
            {{- range $credential, $env := dict "keycloakDbPassword" "KEYCLOAK_DB_PASSWORD" "openfgaDbPassword" "OPENFGA_DB_PASSWORD" }}
            {{- with include "needwise.credentialEnv" (list $ $credential $env) }}
            {{- . | nindent 12 }}
            {{- else }}
            # Not used (that service is external); the script needs the variable set.
            - name: {{ $env }}
              value: ""
            {{- end }}
            {{- end }}
          # Same check as compose: -h 127.0.0.1 forces TCP, which opens only after the init
          # scripts have finished.
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "needwise.infraSecurityContext" true | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
            defaultMode: 0555
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $c.shmSizeLimit }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "needwise.selectorLabels" (list . "postgresql") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with (default .Values.global.storageClass $c.persistence.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $c.persistence.size }}
{{- include "needwise.pdb" (list . "postgresql" $c) }}
{{- end }}
