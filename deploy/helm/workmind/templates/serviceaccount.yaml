{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "workmind.serviceAccountName" . }}
  labels:
    {{- include "workmind.labels" (list . "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No pod of the chart talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
