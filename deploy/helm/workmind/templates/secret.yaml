{{- include "workmind.validate" . -}}
{{- $root := . -}}
{{- $data := dict -}}
{{- range $name := include "workmind.credentialNames" . | fromJsonArray -}}
{{- if include "workmind.credentialInChartSecret" (list $root $name) -}}
{{- $c := get $root.Values.credentials $name -}}
{{- $_ := set $data $c.key (include "workmind.credentialValue" (list $root $name) | b64enc) -}}
{{- end -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workmind.credentialsSecretName" . }}
  labels:
    {{- include "workmind.labels" (list . "credentials") | nindent 4 }}
  annotations:
    # Generated encryption keys and database passwords must outlive the release: the data they
    # protect does. Delete this Secret by hand after an uninstall if you also delete the data.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
