{{- if .Values.openfga.enabled }}
{{- $c := .Values.openfga -}}
{{- $name := include "workmind.componentName" (list . "openfga") -}}
{{- $db := $c.database -}}
{{- $dbHost := default (include "workmind.postgresHost" .) $db.host -}}
{{- $dbPort := ternary $db.port (include "workmind.postgresPort" .) (ne $db.host "") -}}
{{- $uri := printf "postgres://%s:%v/%s?sslmode=%s" $dbHost $dbPort $db.name $db.sslmode -}}
{{ include "workmind.service" (list . "openfga" (dict "ports" (list (dict "name" "http" "port" 8080 "appProtocol" "http") (dict "name" "grpc" "port" 8081 "appProtocol" "grpc")))) }}
---
# Migrates OpenFGA's database. A normal resource (not a hook) named after the release revision:
# every install and upgrade runs it once, while OpenFGA starts next to it and reports
# NOT_SERVING (not ready) until the schema is there.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate-%d" $name .Release.Revision | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "workmind.labels" (list . "openfga-migrate") | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "workmind.selectorLabels" (list . "openfga-migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "workmind.podCommon" (list . $c) | nindent 6 }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "workmind.image" (list . $c.image "") }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          # --timeout: how long it keeps trying to reach the database.
          args: ["migrate", "--timeout", "10m"]
          env:
            {{- include "workmind.openfgaDatastoreEnv" (list . $uri) | nindent 12 }}
          securityContext:
            {{- include "workmind.infraSecurityContext" true | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "workmind.labels" (list . "openfga") | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "workmind.selectorLabels" (list . "openfga") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workmind.selectorLabels" (list . "openfga") | nindent 8 }}
      annotations:
        checksum/credentials: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "workmind.podCommon" (list . $c) | nindent 6 }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openfga
          image: {{ include "workmind.image" (list . $c.image "") }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          args: ["run"]
          env:
            {{- include "workmind.openfgaDatastoreEnv" (list . $uri) | nindent 12 }}
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
            - name: OPENFGA_LOG_FORMAT
              value: json
            # Every API call needs this key; only the WorkMind API knows it.
            - name: OPENFGA_AUTHN_METHOD
              value: preshared
            {{- include "workmind.credentialEnv" (list . "openfgaApiKey" "OPENFGA_AUTHN_PRESHARED_KEYS") | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
          # Same check as compose (grpc_health_probe on 8081), with Kubernetes' gRPC probe.
          readinessProbe:
            grpc: {port: 8081}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            grpc: {port: 8081}
            # Not serving until migrated: give the migrate Job time before restarting.
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          securityContext:
            {{- include "workmind.infraSecurityContext" true | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            # OpenFGA puts a unix socket here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- include "workmind.pdb" (list . "openfga" $c) }}
{{- end }}
