{{- /*
Ingress rules only. Public entry points (web, API, Keycloak) accept networkPolicy.publicFrom
(any source when empty); everything else accepts only the WorkMind pods that use it.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{- $public := .Values.networkPolicy.publicFrom -}}
{{- $policies := list
  (dict "component" "web" "ports" (list 3000) "public" true "from" (list "test"))
  (dict "component" "api" "ports" (list 8000) "public" true "from" (list "web" "keycloak" "test"))
  (dict "component" "worker" "ports" (list) "from" (list))
  (dict "component" "beat" "ports" (list) "from" (list))
-}}
{{- if .Values.keycloak.enabled }}
{{- $policies = append $policies (dict "component" "keycloak" "ports" (list 8080) "public" true "from" (list "api" "seed")) }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- $policies = append $policies (dict "component" "postgresql" "ports" (list 5432) "from" (list "api" "worker" "beat" "migrate" "authz-sync" "seed" "keycloak" "openfga" "openfga-migrate")) }}
{{- end }}
{{- if .Values.valkey.enabled }}
{{- $policies = append $policies (dict "component" "valkey" "ports" (list 6379) "from" (list "api" "worker" "beat" "seed")) }}
{{- end }}
{{- if .Values.qdrant.enabled }}
{{- $policies = append $policies (dict "component" "qdrant" "ports" (list 6333 6334) "from" (list "api" "worker" "seed")) }}
{{- end }}
{{- if .Values.openfga.enabled }}
{{- $policies = append $policies (dict "component" "openfga" "ports" (list 8080 8081) "from" (list "api" "worker" "beat" "authz-sync" "seed")) }}
{{- end }}
{{- if .Values.embeddings.enabled }}
{{- $policies = append $policies (dict "component" "embeddings" "ports" (list 8080) "from" (list "api" "worker" "seed")) }}
{{- end }}
{{- range $i, $p := $policies }}
{{- if $i }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "workmind.componentName" (list $root $p.component) }}
  labels:
    {{- include "workmind.labels" (list $root $p.component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "workmind.selectorLabels" (list $root $p.component) | nindent 6 }}
  policyTypes: [Ingress]
  {{- if not $p.ports }}
  # Nothing connects to this component.
  ingress: []
  {{- else }}
  ingress:
    {{- if and $p.public (not $public) }}
    # Any source (set networkPolicy.publicFrom to your ingress controller or gateway).
    - ports:
        {{- range $p.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- else }}
    - from:
        {{- if $p.public }}
        {{- toYaml $public | nindent 8 }}
        {{- end }}
        {{- if $p.from }}
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: [{{ $root.Release.Name | quote }}]
              - key: app.kubernetes.io/component
                operator: In
                values:
                  {{- range $p.from }}
                  - {{ . }}
                  {{- end }}
        {{- end }}
      ports:
        {{- range $p.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
