{{- /*
`wm authz sync` after every install and upgrade: the step the Compose upgrade procedure runs by
hand (docs/operations/upgrade.md). Each active tenant's OpenFGA store gets the current
authorization model, and its tuples are recomputed from Postgres. Without tenants (a first
install) it does nothing. A post-install/post-upgrade hook after the migrate hook and before the
seed (weights), with the owner role, as the seed. It reads every setting, as the API does: in
production the settings refuse to load without the real credentials.
*/ -}}
{{- if .Values.migrate.authzSync }}
{{- $c := .Values.migrate -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "workmind.componentName" (list . "authz-sync") }}
  labels:
    {{- include "workmind.labels" (list . "authz-sync") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    # Kept after it ran (its logs), replaced by the next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ $c.backoffLimit }}
  activeDeadlineSeconds: {{ $c.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "workmind.selectorLabels" (list . "authz-sync") | nindent 8 }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- include "workmind.podCommon" (list . $c) | nindent 6 }}
      securityContext:
        {{- include "workmind.podSecurityContext" (list . (dict)) | nindent 8 }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "workmind.waitContainer" (list . $c.waitTimeoutSeconds (printf "tcp://%s:%s" (include "workmind.postgresHost" .) (include "workmind.postgresPort" .)) (printf "%s/healthz" (include "workmind.openfgaUrl" .))) | nindent 8 }}
      containers:
        - name: authz-sync
          image: {{ include "workmind.apiImage" . }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["wm", "authz", "sync"]
          envFrom:
            - configMapRef:
                name: {{ include "workmind.componentName" (list . "config") }}
          env:
            {{- include "workmind.appEnv" . | nindent 12 }}
            {{- include "workmind.credentialEnv" (list . "databaseOwnerPassword" "WM_DATABASE_OWNER_PASSWORD") | nindent 12 }}
            - name: MIGRATIONS_DATABASE_URL
              value: {{ include "workmind.databaseUrl" (list . .Values.database.ownerUser "WM_DATABASE_OWNER_PASSWORD") | quote }}
          securityContext:
            {{- include "workmind.securityContext" (list . (dict)) | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
