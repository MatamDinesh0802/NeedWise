{{- $c := .Values.worker -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workmind.componentName" (list . "worker") }}
  labels:
    {{- include "workmind.labels" (list . "worker") | nindent 4 }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "workmind.selectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workmind.selectorLabels" (list . "worker") | nindent 8 }}
        workmind.io/object-storage: "true"
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "workmind.checksums" . | nindent 8 }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "workmind.podCommon" (list . $c) | nindent 6 }}
      securityContext:
        {{- include "workmind.podSecurityContext" (list . $c.podSecurityContext) | nindent 8 }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- with include "workmind.objectStorageAffinity" (list . $c.affinity) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "workmind.apiImage" . }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command:
            - celery
            - -A
            - workmind.workers.celery_app
            - worker
            - -Q
            - {{ join "," $c.queues | quote }}
            - --concurrency
            - {{ $c.concurrency | quote }}
            - --loglevel
            - {{ $c.logLevel | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "workmind.componentName" (list . "config") }}
            {{- with $c.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "workmind.appEnv" . | nindent 12 }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $c.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "workmind.securityContext" (list . $c.securityContext) | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: objects
              mountPath: /data/objects
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: objects
          persistentVolumeClaim:
            claimName: {{ include "workmind.objectStorageClaim" . }}
        - name: models
          {{- if $c.models.persistence }}
          persistentVolumeClaim:
            claimName: {{ default (include "workmind.componentName" (list . "models")) $c.models.existingClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $c.models.sizeLimit }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ $c.tmpSizeLimit }}
{{- if and $c.models.persistence (not $c.models.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "workmind.componentName" (list . "models") }}
  labels:
    {{- include "workmind.labels" (list . "worker") | nindent 4 }}
spec:
  # Every worker replica mounts it: ReadWriteMany when they run on several nodes.
  accessModes: {{ toYaml .Values.objectStorage.accessModes | nindent 4 }}
  {{- with (default .Values.global.storageClass $c.models.storageClass) }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.models.size }}
{{- end }}
{{- include "workmind.hpa" (list . "worker" $c) }}
{{- include "workmind.pdb" (list . "worker" $c) }}
