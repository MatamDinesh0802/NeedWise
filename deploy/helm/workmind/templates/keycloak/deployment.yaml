{{- if .Values.keycloak.enabled }}
{{- $c := .Values.keycloak -}}
{{- $name := include "workmind.componentName" (list . "keycloak") -}}
{{- $db := $c.database -}}
{{- $dbHost := default (include "workmind.postgresHost" .) $db.host -}}
{{- $dbPort := ternary $db.port (include "workmind.postgresPort" .) (ne $db.host "") -}}
{{- $realm := .Files.Get "files/keycloak/realm-workmind.json" -}}
{{- $compose := "http://api:8000/api/auth/backchannel-logout" -}}
{{- if not (contains $compose $realm) -}}
{{- fail (printf "files/keycloak/realm-workmind.json no longer contains %s: update the replacement in templates/keycloak/deployment.yaml" $compose) -}}
{{- end -}}
{{- $realm = replace $compose (printf "%s/api/auth/backchannel-logout" (include "workmind.apiInternalUrl" .)) $realm -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-realm
  labels:
    {{- include "workmind.labels" (list . "keycloak") | nindent 4 }}
data:
  # deploy/keycloak/realm-workmind.json, with the back-channel logout URL pointing at the API's
  # Service. Keycloak replaces the ${...} placeholders from its environment, and imports the
  # realm only when it doesn't exist yet: later changes go through the admin console.
  realm-workmind.json: |
    {{- $realm | nindent 4 }}
---
{{ include "workmind.service" (list . "keycloak" (dict "ports" (list (dict "name" "http" "port" 8080 "appProtocol" "http")))) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "workmind.labels" (list . "keycloak") | nindent 4 }}
spec:
  # One replica with a local cache (sessions are stored in the database). Several replicas need
  # Keycloak's clustered cache; run an external Keycloak (e.g. the Keycloak Operator) for that.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "workmind.selectorLabels" (list . "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workmind.selectorLabels" (list . "keycloak") | nindent 8 }}
      annotations:
        checksum/realm: {{ $realm | sha256sum }}
        checksum/credentials: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "workmind.podCommon" (list . $c) | nindent 6 }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Keycloak exits when its database is unreachable at start; wait for it instead.
        - name: wait-for-database
          image: {{ include "workmind.image" (list . $c.image "") }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              for _ in $$(seq 1 300); do
                (exec 3<>"/dev/tcp/$DB_HOST/$DB_PORT") 2>/dev/null && exit 0
                echo "waiting for $DB_HOST:$DB_PORT"; sleep 2
              done
              echo "timed out waiting for $DB_HOST:$DB_PORT"; exit 1
          env:
            - name: DB_HOST
              value: {{ $dbHost | quote }}
            - name: DB_PORT
              value: {{ $dbPort | quote }}
          securityContext:
            {{- include "workmind.infraSecurityContext" true | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: keycloak
          image: {{ include "workmind.image" (list . $c.image "") }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          args: [{{ $c.startCommand | quote }}, "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s%s" $dbHost $dbPort $db.name $db.jdbcParams | quote }}
            - name: KC_DB_USERNAME
              value: {{ $db.username | quote }}
            {{- include "workmind.credentialEnv" (list . "keycloakDbPassword" "KC_DB_PASSWORD") | nindent 12 }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ $c.adminUser | quote }}
            {{- include "workmind.credentialEnv" (list . "keycloakAdminPassword" "KC_BOOTSTRAP_ADMIN_PASSWORD") | nindent 12 }}
            # Served at <publicUrl>/auth through the Ingress; pods reach it at http://<service>:8080/auth.
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HOSTNAME
              value: {{ printf "%s/auth" (include "workmind.publicUrl" .) | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_CACHE
              value: local
            - name: JAVA_OPTS_KC_HEAP
              value: {{ $c.heapOptions | quote }}
            # Placeholders of the realm import file.
            {{- include "workmind.credentialEnv" (list . "oidcClientSecret" "WORKMIND_OIDC_CLIENT_SECRET") | nindent 12 }}
            - name: WORKMIND_PUBLIC_URL
              value: {{ include "workmind.publicUrl" . | quote }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          # Same endpoint as compose (/auth/health/ready on the management port).
          startupProbe:
            httpGet: {path: /auth/health/started, port: management}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /auth/health/ready, port: management}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /auth/health/live, port: management}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            {{- include "workmind.infraSecurityContext" $c.readOnlyRootFilesystem | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realm
          configMap:
            name: {{ $name }}-realm
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- include "workmind.pdb" (list . "keycloak" $c) }}
{{- end }}
