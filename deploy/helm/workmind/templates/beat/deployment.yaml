{{- $c := .Values.beat -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workmind.componentName" (list . "beat") }}
  labels:
    {{- include "workmind.labels" (list . "beat") | nindent 4 }}
spec:
  # Exactly one scheduler, however many workers: two would queue every task twice. Recreate
  # stops the old pod before the new one starts (and frees the ReadWriteOnce schedule volume).
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "workmind.selectorLabels" (list . "beat") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workmind.selectorLabels" (list . "beat") | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "workmind.checksums" . | nindent 8 }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "workmind.podCommon" (list . $c) | nindent 6 }}
      securityContext:
        {{- include "workmind.podSecurityContext" (list . $c.podSecurityContext) | nindent 8 }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: beat
          image: {{ include "workmind.apiImage" . }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command:
            - celery
            - -A
            - workmind.workers.celery_app
            - beat
            - --loglevel
            - {{ $c.logLevel | quote }}
            - --schedule
            - /var/lib/celerybeat/schedule
          envFrom:
            - configMapRef:
                name: {{ include "workmind.componentName" (list . "config") }}
          env:
            {{- include "workmind.appEnv" . | nindent 12 }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $c.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "workmind.securityContext" (list . $c.securityContext) | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: schedule
              mountPath: /var/lib/celerybeat
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schedule
          {{- if $c.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "workmind.componentName" (list . "beat")) $c.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ $c.tmpSizeLimit }}
{{- if and $c.persistence.enabled (not $c.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "workmind.componentName" (list . "beat") }}
  labels:
    {{- include "workmind.labels" (list . "beat") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with (default .Values.global.storageClass $c.persistence.storageClass) }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.persistence.size }}
{{- end }}
