# Every dependency runs outside the chart: a managed Postgres, Valkey, Qdrant, OpenFGA and
# Keycloak you operate, and an embedding API. Only WorkMind's own workloads are installed.
#   helm install workmind deploy/helm/workmind -n workmind -f deploy/helm/workmind/examples/external-services.yaml
# Before installing, prepare the services as docs/deploy/kubernetes.md ("External services")
# describes: the two database roles and the database, the realm in Keycloak, the OpenFGA key.

config:
  publicUrl: https://workmind.example.com
  embedding:
    # Any OpenAI-compatible /v1/embeddings server. Changing the model later means re-indexing.
    baseUrl: http://embeddings.ml.svc.cluster.local:8080/v1
    model: embeddinggemma-300m
    dimensions: 768

database:
  host: postgres.example.internal
  port: 5432
  name: workmind
  appUser: workmind_app
  ownerUser: workmind_owner
  urlParams: ssl=require

postgresql:
  enabled: false

valkey:
  enabled: false
  auth:
    enabled: true
  external:
    host: valkey.example.internal
    port: 6380
    tls: true

qdrant:
  enabled: false
  external:
    url: http://qdrant.vector.svc.cluster.local:6333

openfga:
  enabled: false
  external:
    url: http://openfga.authz.svc.cluster.local:8080

keycloak:
  enabled: false
  external:
    # The base URL with Keycloak's relative path, if it has one. The realm "workmind" must exist
    # there with the confidential client "workmind-api" (files/keycloak/realm-workmind.json).
    url: https://sso.example.com
  realm: workmind
  oidcClientId: workmind-api

embeddings:
  enabled: false

# One Secret you manage holds every credential, under these keys:
#   database-app-password, database-owner-password, valkey-password, openfga-api-key,
#   oidc-client-secret, secrets-key, secrets-encryption-key, anthropic-api-key
# and, when used: secrets-encryption-previous-keys, smtp-password, google-client-secret,
#   license-key, mcp-servers, llm-api-key, local-llm-api-key, embedding-api-key,
#   transcription-api-key
credentials:
  existingSecret: workmind-credentials

ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
    secretName: workmind-tls
