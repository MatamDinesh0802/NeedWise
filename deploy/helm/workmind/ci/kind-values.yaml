# deploy/helm/kind-test.sh only: the chart on a kind cluster, as CI runs the compose stack.
# Images loaded into the nodes, ingress-nginx, hash embeddings (no embedding server), no model
# key, the demo seed from an image built from seed/, NetworkPolicies on. Not a recommended setup.
images:
  api: {repository: workmind-api, tag: kind}
  web: {repository: workmind-web, tag: kind}
config:
  # The script sets the port it publishes (HTTP_PORT). "localhost": the end-to-end tests treat it
  # as a secure context, as browsers do, for Keycloak's cookies over http.
  publicUrl: http://localhost:8680
  appEnv: demo
  embedding:
    provider: hash
    model: hash-ci
  # RETRIEVAL_MIN_SIMILARITY stays at its default here. CI's compose stack sets it to 0 (for the
  # permission-gate eval); then the guest's one collection always matches, her chat question
  # goes to the model, and without a key the API end-to-end test that expects "not found" fails.
embeddings:
  enabled: false
seed:
  enabled: true
  data:
    source: image
    image: {repository: workmind-seed, tag: kind}
ingress:
  className: nginx
  annotations:
    # Uploads up to 500 MB (meeting recordings) and answers streamed for minutes.
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
networkPolicy:
  enabled: true
  publicFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
