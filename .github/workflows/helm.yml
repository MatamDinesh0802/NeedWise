name: Helm chart

# Lints and renders deploy/helm/needwise, validates the output against the Kubernetes schemas
# and the chart's own rules (deploy/helm/validate.sh). No cluster: installing the chart is
# tested separately.
on:
  push:
    branches: [main]
    paths:
      - deploy/helm/**
      - deploy/postgres/**
      - deploy/keycloak/**
      - .github/workflows/helm.yml
  pull_request:
    paths:
      - deploy/helm/**
      - deploy/postgres/**
      - deploy/keycloak/**
      - .github/workflows/helm.yml

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Chart · lint, template, kubeconform (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.19.0, v4.0.0]
    env:
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install kubeconform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate the chart (Kubernetes 1.33 schemas)
        env:
          KUBERNETES_VERSION: 1.33.0
          PYTHON: uv run --no-project --with pyyaml==6.0.2 python
        run: deploy/helm/validate.sh
