name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
        ports: ["6333:6333"]
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_VALKEY_URL: redis://localhost:6379/15
      TEST_OPENFGA_URL: http://localhost:8401
      TEST_OPENFGA_API_KEY: ci-only-key
      TEST_QDRANT_URL: http://localhost:6333
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Start OpenFGA (in-memory) for integration tests
        run: |
          docker run -d --name openfga -p 8401:8080 \
            -e OPENFGA_AUTHN_METHOD=preshared -e OPENFGA_AUTHN_PRESHARED_KEYS=ci-only-key \
            -e OPENFGA_PLAYGROUND_ENABLED=false \
            openfga/openfga:v1.22.1@sha256:b852071314f1fda1194d341a6ebac0a4f619b3cd87a6626d2ccc7048af4ec671 run
          for _ in $(seq 1 30); do curl -fs http://localhost:8401/healthz && break; sleep 1; done
      # With the Enterprise package installed: the tests prove it stays unloaded without a license.
      - run: uv sync --locked --extra ee
      - run: uv run ruff check . ../../ee/python
      - run: uv run ruff format --check . ../../ee/python
      - run: uv run pyright
      - run: uv run pytest
      - name: Models and migrations match (alembic check on the migrated test database)
        env:
          MIGRATIONS_DATABASE_URL: postgresql+asyncpg://workmind_test_owner:test-only-password@localhost:5432/workmind_test
        run: uv run alembic check

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  authz-model:
    name: Authorization model · matrix tests, compiled JSON up to date
    runs-on: ubuntu-latest
    env:
      MODEL_DIR: apps/api/src/workmind/modules/authz/openfga
      FGA_CLI: openfga/cli:v0.8.2@sha256:31a565d14d1c5ca8170d3a2225eb66517d9f490539967bcb3421613c5e2538a4
    steps:
      - uses: actions/checkout@v7
      - name: Authorization matrix (model.fga.yaml)
        run: docker run --rm -v "$PWD/$MODEL_DIR:/model:ro" "$FGA_CLI" model test --tests /model/model.fga.yaml
      - name: model.json was regenerated from model.fga (run `make authz-model`)
        run: |
          docker run --rm -v "$PWD/$MODEL_DIR:/model:ro" "$FGA_CLI" \
            model transform --file /model/model.fga > "$RUNNER_TEMP/model.json"
          diff <(python3 -m json.tool --sort-keys "$RUNNER_TEMP/model.json") \
               <(python3 -m json.tool --sort-keys "$MODEL_DIR/model.json")

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum from the release's checksums.txt)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --verbose .

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $c is missing a DCO sign-off (use: git commit -s)"
              missing=1
            fi
          done
          exit $missing

  stack:
    name: Stack starts healthy (docker compose)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Use deterministic hash embeddings (CI has no embedding model server)
        # The stack keeps the default relevance floor: the end-to-end tests expect a guest's
        # unrelated question to find nothing without calling a model (CI has no model key).
        run: printf 'EMBEDDING_PROVIDER=hash\nEMBEDDING_MODEL=hash-ci\n' > .env
      - name: Object storage writable by the containers (uid 10001)
        # A fresh checkout has no .data/objects: the Docker daemon would create it as root,
        # and every upload, dataset and seed write would fail with "Permission denied".
        run: make objects-dir
      - run: docker compose up -d --build --wait
      - name: All components report ok through Caddy
        run: |
          curl -fsS http://localhost:8480/api/v1/system/status | tee status.json
          python3 -c "import json,sys; d=json.load(open('status.json')); sys.exit(0 if d['status']=='ok' else 1)"
          curl -fsS -o /dev/null http://localhost:8480/
          curl -fsS -o /dev/null http://localhost:8480/auth/realms/master
      - name: Seed the demo company and its 49 documents through the real ingestion pipeline
        run: docker compose --profile tools run --rm seed
      - name: Permission gate - every red-team attack, every retrieval mode, zero leaks
        # No relevance floor for the gate (it is calibrated for real embeddings), so it checks
        # every candidate a search can return.
        run: >-
          docker compose --profile tools run --rm -v "$PWD/evals:/evals:ro"
          -e WORKMIND_EVALS_DIR=/evals -e RETRIEVAL_MIN_SIMILARITY=0 seed
          python -m workmind.evals --retrieval-only --out /tmp/eval-results --label ci
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: End-to-end tests (real Keycloak logins through Caddy)
        working-directory: apps/api
        env:
          E2E_BASE_URL: http://localhost:8480
        run: uv run pytest tests/e2e -v
      # Browser suite (e2e/browser): Community edition, hash embeddings, no model key, so the
      # @model tests are left out (they run with E2E_MODEL=1).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/browser/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/browser/pnpm-lock.yaml
      - name: Install the browser suite and Chromium (with its system libraries)
        working-directory: e2e/browser
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm exec playwright install --with-deps chromium
      - name: Browser end-to-end tests (Playwright, Chromium)
        working-directory: e2e/browser
        env:
          E2E_BASE_URL: http://localhost:8480
        run: pnpm exec playwright test
      - name: Upload the browser test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/browser/playwright-report/
            e2e/browser/test-results/
          retention-days: 14
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color | tail -n 300
      - name: Tear down
        if: always()
        run: docker compose down -v
