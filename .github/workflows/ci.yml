name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.3-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_VALKEY_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
      - run: ./gitleaks git --redact --verbose .

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $c is missing a DCO sign-off (use: git commit -s)"
              missing=1
            fi
          done
          exit $missing

  stack:
    name: Stack starts healthy (docker compose)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - name: All components report ok through Caddy
        run: |
          curl -fsS http://localhost:8480/api/v1/system/status | tee status.json
          python3 -c "import json,sys; d=json.load(open('status.json')); sys.exit(0 if d['status']=='ok' else 1)"
          curl -fsS -o /dev/null http://localhost:8480/
          curl -fsS -o /dev/null http://localhost:8480/auth/realms/master
      - name: Seed the demo company
        run: docker compose --profile tools run --rm seed
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: End-to-end tests (real Keycloak logins through Caddy)
        working-directory: apps/api
        env:
          E2E_BASE_URL: http://localhost:8480
        run: uv run pytest tests/e2e -v
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color | tail -n 300
      - name: Tear down
        if: always()
        run: docker compose down -v
