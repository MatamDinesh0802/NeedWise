name: Docs

# Builds the documentation site (mkdocs.yml) with --strict on every pull request and every push
# to main: a broken link, a missing anchor or a page missing from the build fails it. The site is
# not published anywhere: the docs are read in the repository. (The reference pages in
# docs/reference/ are checked against the code by the API tests in ci.yml.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docs · strict build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: docs/requirements.txt
      - name: Build (strict)
        env:
          # Links from the docs to files outside docs/ point to this repository.
          DOCS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: make docs
