[project]
name = "workmind"
version = "0.0.1"
description = "WorkMind AI API: open-source, permission-aware enterprise AI workspace"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.4.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wm = "workmind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workmind"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = ["S104"] # binding to 0.0.0.0 is intentional inside containers

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts, and fake credentials in fixtures
"migrations/**" = ["N999"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]   # tests run in standard mode: TestClient is untyped upstream
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL / Valkey (TEST_DATABASE_ADMIN_URL, TEST_VALKEY_URL)",
    "e2e: needs the full running stack, seeded (E2E_BASE_URL)",
]
